<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Scorer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5b6b79;--bd:#dde3e9;--ac:#0b7a4b;--ac2:#e6f4ec;--dg:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151b;--card:#16202a;--tx:#e8eef3;--mu:#93a4b3;--bd:#263544;--ac:#2fbf80;--ac2:#12332a;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0e151b;--card:#16202a;--tx:#e8eef3;--mu:#93a4b3;--bd:#263544;--ac:#2fbf80;--ac2:#12332a;--dg:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
main{margin:0 auto;padding:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.big{font-size:34px;font-weight:800}.mu{color:var(--mu);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.g{display:grid;gap:8px}.g7{grid-template-columns:repeat(7,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g7 button{padding:16px 0;font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu)}td.r,th.r{text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tk{display:inline-block;min-width:26px;text-align:center;padding:3px 6px;border-radius:14px;background:var(--ac2);margin:2px;font-weight:700}
.tk.w{background:var(--dg);color:#fff}
.ov{overflow-x:auto}label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}input,select,textarea{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
@keyframes gin{from{opacity:0;transform:translateY(3%)}to{opacity:1;transform:none}}
.hb{padding:1px 7px;font-size:11px;border-radius:10px;margin-left:4px}
.shell{display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.top .t{font-weight:800;color:var(--ac);white-space:nowrap}
.ib{position:relative;padding:7px 10px;border-radius:10px;white-space:nowrap}
.bdg{position:absolute;top:-5px;right:-4px;background:var(--dg);color:#fff;border-radius:10px;font-size:11px;padding:0 5px}
.body{display:flex;flex:1;min-height:0}
.side{width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);padding:10px;overflow-y:auto}
.side button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;margin:1px 0;font-size:14px}
.side button.on{background:var(--ac2);color:var(--ac);font-weight:700}
.side .ph{font-size:10px;color:var(--mu);border:1px solid var(--bd);border-radius:8px;padding:0 6px;white-space:nowrap}
.side h4{margin:14px 8px 4px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.side a.pl{display:block;padding:9px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
.side a.pl:hover{background:var(--ac2)}
.content{flex:1;min-width:0;padding:12px;max-width:1000px;margin:0 auto;width:100%}
.dd{position:absolute;right:0;top:112%;width:min(340px,92vw);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:30;font-size:14px;text-align:left}
.dd .it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:7px 4px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sg .card{margin:0}.sg .big{font-size:28px}
.hamb{display:none}
@media(max-width:820px){.hamb{display:inline-block}.side{position:fixed;top:52px;bottom:0;left:0;z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.3)}.side.open{transform:none}.top .t{display:none}}
</style></head><body><main id="m"></main><div id="toast" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:9;max-width:90vw"></div>
<script>
//ENGINE
function newInn(bat,bowl,target){const s={bat,bowl,target,runs:0,wk:0,legal:0,ext:{wd:0,nb:0,b:0,lb:0},B:{},W:{},fow:[],strike:null,non:null,bowler:null,last:null,over:[],oR:0,part:{r:0,b:0},done:false,log:[],wheels:[],free:false,declared:false,needBatter:true,needBowler:true};
 return s}
function nb(){return{r:0,b:0,f:0,s:0,out:null}}
function ovTxt(n){return Math.floor(n/6)+'.'+(n%6)}
function swap(s){const t=s.strike;s.strike=s.non;s.non=t}
function wOk(k,free,t){return free?['run out','obstructing','hit ball twice'].includes(t):(k==='n'||k==='b'||k==='lb')?true:k==='wd'?['stumped','run out','hit wicket','obstructing','hit ball twice'].includes(t):['run out','obstructing','hit ball twice'].includes(t)}
function ball(s,e,cfg){
 if(s.done||s.needBatter||s.needBowler)return;
 const k=e.k,r=e.r|0,w=e.w;let legal=true,bat=0,ex=0,faced=true,bw=0;
 if(w&&!wOk(k,s.free,w.type))throw new Error('Invalid dismissal for this delivery');
 if(k==='n'){bat=r;bw=r}
 else if(k==='wd'){legal=false;ex=1+r;faced=false;bw=ex}
 else if(k==='nb'){legal=false;ex=1;bat=r;bw=1+r}
 else{ex=r}
 s.runs+=bat+ex;
 const st=s.strike,bo=s.bowler,B=s.B[st],W=s.W[bo];
 if(faced)B.b++;
 if(k==='n'||k==='nb'){B.r+=bat;if(bat===4)B.f++;if(bat===6)B.s++}
 if(k!=='n'&&k!=='nb')s.ext[k]+=ex;else if(k==='nb')s.ext.nb+=1;
 W.r+=bw;if(legal)W.b++;if(k==='wd')W.wd++;if(k==='nb')W.nb++;
 s.oR+=bw;s.part.r+=bat+ex;if(legal){s.part.b++;s.legal++}
 let tok=(k==='n'?'':k==='wd'?'Wd':k==='nb'?'Nb':k==='b'?'B':'Lb')+((k==='n'||r>0)?r:'');if(k==='wd'&&r===0)tok='Wd';
 let txt='';
 const ro=(k==='n'?'':k==='wd'?'Wide':k==='nb'?'No ball':k==='b'?'Bye':'Leg bye');
 if(w){
  const ok=wOk(k,s.free,w.type);
  if(!ok)throw new Error('Invalid dismissal for this delivery');
  const out=w.who==='non'?s.non:s.strike;
  if(['bowled','caught','lbw','stumped','hit wicket'].includes(w.type))W.w++;
  const f=w.f?w.f:'';
  s.B[out].out=({bowled:'b '+bo,caught:(f===bo?'c & b '+bo:'c '+(f||'sub')+' b '+bo),lbw:'lbw b '+bo,stumped:'st '+(f||'keeper')+' b '+bo,'hit wicket':'hit wkt b '+bo,'hit ball twice':'hit the ball twice',obstructing:'obstructing the field','run out':'run out'+(f?' ('+f+')':'')})[w.type]||w.type;
  s.wk++;s.fow.push({n:s.wk,r:s.runs,name:out,ov:ovTxt(s.legal)});s.part={r:0,b:0};tok+='W';
  txt='OUT! '+out+' '+s.B[out].out+'. '+s.runs+'/'+s.wk;
  s.dis=out;
 }
 const rs=k==='n'?r:k==='wd'||k==='nb'||k==='b'||k==='lb'?r:0;
 if(rs%2===1)swap(s);
 if(w){if(s.strike===s.dis)s.strike=null;else s.non=null}
 if(!w){txt=k==='n'?(bat===0?'Dot ball.':bat===4?'FOUR! Cracked away.':bat===6?'SIX! Out of the ground.':bat+' run'+(bat>1?'s':'')+' taken.'):ro+(r?' +'+r:'')+'. '+(k==='wd'||k==='nb'?'Extra ball to come.':'')}
 s.over.push(tok);
 s.log.push({id:e.id,rn:(k==='n'||k==='nb')?bat:0,ov:ovTxt(legal?s.legal-1:s.legal),b:bo,t:st,txt:txt+' ('+s.runs+'/'+s.wk+')'});
 if(legal&&s.legal%6===0){swap(s);if(s.oR===0)W.m++;s.last=bo;s.bowler=null;s.needBowler=true;s.over=[];s.oR=0}
 const allOut=s.wk>=s.bat.length-1;
 if(legal)s.free=false;if(k==='nb'&&cfg.limited!==false)s.free=true;
 if(allOut||(cfg.overs>0&&s.legal>=cfg.overs*6)||(s.target&&s.runs>=s.target))s.done=true;
 else if(w){if(s.bat.some(n=>!s.B[n]||s.B[n].rh))s.needBatter=true;else s.done=true}
}
function reduce(evs){
 const un=new Set(evs.filter(e=>e.t==='undo').map(e=>e.target));
 let cfg=null,inns=[],err=null,drawn=false;const hands={};
 const cur=()=>inns[inns.length-1];
 for(const e of evs){if(un.has(e.id)||e.t==='undo')continue;
  if(e.t==='draw'){drawn=true;continue}
  if(e.t==='hand'){hands[e.n]=e.h==='L'?'L':'R';continue}
  if(e.t==='start'){cfg=e.cfg;inns=[newInn(cfg.players[cfg.first],cfg.players[1-cfg.first],0)];continue}
  const s=cur();
  try{
  if(e.t==='bowler'){s.bowler=e.n;s.W[e.n]=s.W[e.n]||{b:0,r:0,w:0,m:0,wd:0,nb:0};s.needBowler=false}
  else if(e.t==='nofh'){s.free=false}
  else if(e.t==='declare'){if(!s.done&&(cfg.nInn||2)===4&&inns.length<4){s.done=true;s.declared=true}}
  else if(e.t==='swap'){if(s.strike&&s.non&&!s.done)swap(s)}
  else if(e.t==='wheel'){if(!e.skip){const lg=s.log.find(l=>l.id===e.ball);if(lg)s.wheels.push({x:e.x,y:e.y,batter:lg.t,runs:lg.rn,bowler:lg.b,ball:e.ball})}}
  else if(e.t==='batter'){if(s.B[e.n]){s.B[e.n].rh=false;s.B[e.n].out=null}else s.B[e.n]=nb();if(s.strike===null)s.strike=e.n;else s.non=e.n;s.needBatter=s.strike===null||s.non===null}
  else if(e.t==='retire'&&!s.done&&!s.needBatter){const out=e.who==='non'?s.non:s.strike;if(out){const o=s.B[out];
   if(e.kind==='hurt'){o.out='retired hurt';o.rh=true}else{o.out='retired out';s.wk++;s.fow.push({n:s.wk,r:s.runs,name:out,ov:ovTxt(s.legal)});s.part={r:0,b:0}}
   if(s.strike===out)s.strike=null;else s.non=null;
   s.log.push({ov:ovTxt(s.legal),b:s.bowler||'-',t:out,txt:out+' '+o.out+'. '+s.runs+'/'+s.wk});
   if(s.wk>=s.bat.length-1||!s.bat.some(n=>!s.B[n]||(s.B[n].rh&&n!==out)))s.done=true;else s.needBatter=true}}
  else if(e.t==='timedout'&&s.needBatter&&!s.B[e.n]){const o=s.B[e.n]=nb();o.out='timed out';s.wk++;s.fow.push({n:s.wk,r:s.runs,name:e.n,ov:ovTxt(s.legal)});s.part={r:0,b:0};
   s.log.push({ov:ovTxt(s.legal),b:s.bowler||'-',t:e.n,txt:'OUT! '+e.n+' timed out. '+s.runs+'/'+s.wk});
   if(s.wk>=s.bat.length-1||!s.bat.some(n=>!s.B[n]||s.B[n].rh))s.done=true}
  else if(e.t==='ball')ball(s,e,cfg);
  }catch(x){err=x.message}
  const nI=cfg.nInn||2;
  if(s.done&&s===cur()&&inns.length<nI&&!(nI===4&&inns.length===3&&inns[0].runs+inns[2].runs<inns[1].runs)){const idx=inns.length,bi=idx%2===0?cfg.first:1-cfg.first;let tg=0;
   if(idx===nI-1){let opp=0,own=0;inns.forEach((x,j)=>{if(j%2===idx%2)own+=x.runs;else opp+=x.runs});tg=opp-own+1}
   inns.push(newInn(cfg.players[bi],cfg.players[1-bi],tg))}
 }
 let result=null;const nI=cfg?(cfg.nInn||2):2,T=i=>cfg.names[i%2===0?cfg.first:1-cfg.first],wl=x=>{const n=x.bat.length-1-x.wk;return n+' wicket'+(n===1?'':'s')};
 if(drawn)result='Match drawn';
 else if(nI===2){if(inns.length===2&&inns[1].done){const a=inns[0],b=inns[1];result=b.runs>=b.target?T(1)+' won by '+wl(b):b.runs===a.runs?'Match tied':T(0)+' won by '+(a.runs-b.runs)+' runs'}}
 else{if(inns.length===3&&inns[2].done&&inns[0].runs+inns[2].runs<inns[1].runs)result=T(1)+' won by an innings and '+(inns[1].runs-inns[0].runs-inns[2].runs)+' runs';
  else if(inns.length===4&&inns[3].done){const d=inns[3],c=inns[1].runs+d.runs,o=inns[0].runs+inns[2].runs;result=c>o?T(3)+' won by '+wl(d):c===o?'Match tied':T(0)+' won by '+(o-c)+' runs'}}
 return{cfg,inns,result,err,hands}
}
//ENDENGINE
const WW=Object.freeze({entry:'bottom',display:'bottom'});   // the bowler's end is always drawn at the bottom
let NAVOPEN=false,NOTIFOPEN=false,ACCTOPEN=false,GQ='',THEME='auto',ACCT={name:'Scorer'},NOTIFS=[],TEAMSEL='',NEWTEAM=false,PQ='',PTEAM='',PUB=null,PUBL=0,PROBED=0;
let DB={matches:[],rosters:{}},CUR=null,VIEW='home',CONF=null,HQ='',SETUPFX=null,TOASTMSG='';
let EV=[],R=null,tab='score',mode='n',dlg=null,WD=null,RT=null,WWON=true,WFB={},WWMSG='';
loadDB();loadPrefs();
const lsave=()=>{try{localStorage.setItem('cs2',JSON.stringify({matches:DB.matches,cur:CUR,rosters:DB.rosters}))}catch(e){}};
const sv=()=>{const cm=DB.matches.find(x=>x.id===CUR);if(cm)cm.updated=Math.max(Date.now(),(cm.updated||0)+1);lsave();syncSoon()};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SEQ=EV.length;const push=o=>{const b=nsnap();if(o.t==='ball')WWMSG='';EV.push({id:++SEQ+'-'+Math.random().toString(36).slice(2,6),at:new Date().toLocaleTimeString(),by:ACCT.name,...o});sv();ui();nchk(b)};
function loadDB(){try{const d=JSON.parse(localStorage.getItem('cs2')||'null');
 if(d&&d.matches){DB={matches:d.matches,rosters:d.rosters||{}};CUR=d.cur||null}
 else{const old=JSON.parse(localStorage.getItem('cs1')||'[]');if(old.length){const m={id:newId(),events:old,updated:Date.now()};DB.matches.push(m);CUR=m.id}}}catch(e){}
 const cm=DB.matches.find(x=>x.id===CUR);EV=cm?cm.events:[];VIEW=cm&&(EV.length||cm.imp)?'match':'dash'}
function newId(){return'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(t){TOASTMSG=t;const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{e.style.display='none'},3500)}
function ask(msg,fn){CONF={msg,fn};ui()}
function confYes(){const f=CONF&&CONF.fn;CONF=null;if(f)f();ui()}
function loadPrefs(){try{THEME=localStorage.getItem('cs-theme')||'auto';ACCT=JSON.parse(localStorage.getItem('cs-acct')||'null')||ACCT;NOTIFS=JSON.parse(localStorage.getItem('cs-notif')||'[]');}catch(e){}applyTheme()}
function applyTheme(){try{const r=document.documentElement;if(r&&r.setAttribute){if(THEME==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',THEME)}}catch(e){}}
function cycleTheme(){THEME=THEME==='auto'?'dark':THEME==='dark'?'light':'auto';try{localStorage.setItem('cs-theme',THEME)}catch(e){}applyTheme();ui()}
function saveAcct(){const v=(document.getElementById('an').value||'').trim().slice(0,40);if(v)ACCT.name=v;try{localStorage.setItem('cs-acct',JSON.stringify(ACCT))}catch(e){}ACCTOPEN=false;toast('Saved');ui()}
function saveN(){try{localStorage.setItem('cs-notif',JSON.stringify(NOTIFS))}catch(e){}}
function notify(x){NOTIFS.unshift({t:Date.now(),x,r:false});NOTIFS=NOTIFS.slice(0,40);saveN()}
function nsnap(){if(!R||!R.inns||IMPM())return null;const l=R.inns[R.inns.length-1];return{wk:R.inns.reduce((t,x)=>t+x.wk,0),n:R.inns.length,res:R.result||'',free:!!l.free}}
function nchk(b){if(!b||!R||IMPM())return;const a=nsnap();if(!a)return;const tm=j=>R.cfg.names[j%2===0?R.cfg.first:1-R.cfg.first],sc=j=>tm(j)+' '+R.inns[j].runs+'/'+R.inns[j].wk;
 if(a.wk>b.wk)notify('Wicket — '+sc(b.n-1));if(a.n>b.n)notify('Innings '+b.n+' complete — '+sc(b.n-1));if(a.res&&!b.res)notify('Result — '+a.res);if(a.free&&!b.free)notify('Free hit awarded');saveN()}
function toggleNotif(){NOTIFOPEN=!NOTIFOPEN;ACCTOPEN=false;ui();if(NOTIFOPEN){NOTIFS.forEach(n=>{n.r=true});saveN()}}
function toggleAcct(){ACCTOPEN=!ACCTOPEN;NOTIFOPEN=false;ui()}
function teamNames(){const s=new Set(Object.keys(DB.rosters));DB.matches.forEach(m=>mInfo(m).names.forEach(n=>{if(n&&n!=='?')s.add(n)}));return[...s].sort()}
function gsrHtml(){const q=GQ.trim().toLowerCase();if(!q)return'';const it=(k,v,l,s)=>`<button class="it" data-k="${k}" data-v="${E(v)}" onclick="gsOpen(this.dataset.k,this.dataset.v)">${l}<div class="mu">${s}</div></button>`;
 const ms=DB.matches.map(m=>({m,i:mInfo(m)})).filter(({i})=>(i.names.join(' ')+' '+i.venue+' '+i.fmt+' '+(i.res||'')).toLowerCase().includes(q)).slice(0,5).map(({m,i})=>it('m',m.id,'🏏 '+E(i.names.join(' v ')),E(i.st==='live'?'Live':i.st==='fixture'?'Fixture':(i.res||'Completed'))));
 const ts=teamNames().filter(n=>n.toLowerCase().includes(q)).slice(0,5).map(n=>it('t',n,'👥 '+E(n),'Team'));
 const ps=[];Object.entries(DB.rosters).forEach(([t,a])=>a.forEach(n=>{if(n.toLowerCase().includes(q)&&ps.length<5)ps.push(it('p',t+'|'+n,'🧍 '+E(n),E(t)))}));
 const all=ms.concat(ts,ps);return`<div class="dd" style="right:auto;left:0">${all.length?all.join(''):'<div class="mu">No matches, teams or players found.</div>'}</div>`}
function gsearch(v){GQ=v;const el=document.getElementById('gsr');if(el)el.innerHTML=gsrHtml()}
function gsOpen(k,v){GQ='';if(k==='m')openMatch(v);else if(k==='t'){NAVOPEN=false;viewTeam(v)}else{PQ=v.split('|')[1];PTEAM='';VIEW='players';ui()}}
function topbar(){const un=NOTIFS.filter(n=>!n.r).length,tl=THEME==='auto'?'◐ Auto':THEME==='dark'?'🌙 Dark':'☀️ Light';
 return`<div class="top"><button class="hamb ib" onclick="NAVOPEN=!NAVOPEN;ui()" title="Menu">☰</button><span class="t">🏏 Cricket Platform</span>
 <span class="ddw" style="position:relative;flex:1;min-width:0"><input id="gs" style="width:100%" placeholder="Search matches, teams, players…" value="${E(GQ)}" oninput="gsearch(this.value)" autocomplete="off"><span id="gsr">${gsrHtml()}</span></span>
 <span class="ddw" style="position:relative"><button class="ib" onclick="toggleNotif()" title="Notifications">🔔${un?`<span class="bdg">${un}</span>`:''}</button>${NOTIFOPEN?`<div class="dd"><b>Notifications</b>${NOTIFS.length?NOTIFS.slice(0,15).map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)">${E(n.x)}<div class="mu">${E(new Date(n.t).toLocaleString())}</div></div>`).join('')+'<p><button onclick="NOTIFS=[];saveN();ui()">Clear all</button></p>':'<div class="mu" style="margin-top:6px">Nothing yet. Wickets, innings, results and imports appear here.</div>'}</div>`:''}</span>
 <button class="ib" onclick="cycleTheme()" title="Theme: auto, dark, light">${tl}</button>
 <span class="ddw" style="position:relative"><button class="ib" onclick="toggleAcct()">👤 ${E(ACCT.name)}</button>${ACCTOPEN?`<div class="dd"><b>Account</b><label>Your name (shown in the event log)</label><input id="an" value="${E(ACCT.name)}"><p><button class="p" onclick="saveAcct()">Save</button></p><div class="mu">This page runs in your browser and has no sign-in. Accounts and roles (Administrator, Scorer, Team Manager, Tournament Manager, Broadcaster, Viewer) are in the server project.</div><p><button onclick="navGo('users')">User Management</button></p></div>`:''}</span></div>`}

function dash(){const all=allM(),live=all.filter(x=>x.i.st==='live'),fx=all.filter(x=>x.i.st==='fixture').sort((a,b)=>((a.m.fx&&a.m.fx.date)||'9').localeCompare((b.m.fx&&b.m.fx.date)||'9')),dn=all.filter(x=>x.i.st==='done').sort((a,b)=>b.m.updated-a.m.updated),np=Object.values(DB.rosters).reduce((a,x)=>a+x.length,0);
 const st=(n,l,s)=>`<div class="card"><div class="big">${n}</div><div>${l}</div>${s?`<div class="mu">${s}</div>`:''}</div>`,open=m=>`<button class="p" onclick="openMatch('${m.id}')">Open</button>`;
 return`<h2 style="margin:0 0 8px">📊 Dashboard</h2><div class="sg">${st(live.length,'Live matches')}${st(fx.length,'Upcoming matches')}${st(dn.length,'Matches played')}${st(teamNames().length,'Registered teams')}${st(np,'Registered players')}${st('—','Active tournaments','Phase 5')}</div>
 <div class="row" style="align-items:flex-start;flex-wrap:wrap"><div style="min-width:280px"><h3 style="margin:8px 0">🔴 Currently live</h3>${live.length?live.map(x=>mRow(x,open(x.m))).join(''):'<div class="card mu">No match is being scored right now.</div>'}<h3 style="margin:8px 0">📅 Upcoming</h3>${fx.length?fx.slice(0,4).map(x=>mRow(x,`<button class="p" onclick="startFixture('${x.m.id}')">Start match</button>`)).join(''):'<div class="card mu">No fixtures yet.</div>'}</div>

 <div class="row" style="margin-top:6px"><button class="p" onclick="newMatch()">+ New match</button><button onclick="addFixture()">+ Add fixture</button><button onclick="goImport()">⬇ Import match</button></div>`}

 ${ns.length?ns.map(n=>`<div class="card"><b>${E(n)}</b> <span class="mu">${(DB.rosters[n]||[]).length} players · ${allM().filter(x=>x.i.names.includes(n)).length} matches</span><div style="margin-top:6px"><button class="p" data-n="${E(n)}" onclick="viewTeam(this.dataset.n)">Open</button></div></div>`).join(''):'<div class="card mu">No teams yet. Teams are created here or when you start a match.</div>'}`}

function planned(v){const P={
 tournaments:['🏆 Tournaments','Phase 5','Create tournaments with groups, a points table with Net Run Rate, and knockout stages.','Single matches already work from Matches.'],

 const roles=v==='users'?`<div class="card"><b>Roles in the server project</b><ul style="margin:6px 0"><li><b>Administrator</b>: full access, users, database, designs</li><li><b>Scorer</b>: scoring and corrections</li><li><b>Team Manager</b>: own team and players</li><li><b>Tournament Manager</b>: tournaments and fixtures</li><li><b>Broadcaster</b>: Broadcast Studio and overlays</li><li><b>Viewer</b>: public scores</li></ul></div>`:'';

 return`<h2 style="margin:0 0 8px">${P[0]}</h2><div class="card"><div style="display:inline-block;background:var(--ac2);color:var(--ac);border-radius:10px;padding:2px 10px;font-weight:700;font-size:13px">${P[1]?'Planned · '+P[1]:'Not available in this page'}</div><p style="margin:10px 0 4px"><b>${E(P[2])}</b></p><p class="mu" style="margin:0 0 10px">${E(P[3])}</p><div>${acts}</div></div>${roles}`}
function pickActive(id){const m=DB.matches.find(x=>x.id===id);if(!m)return;CUR=id;EV=m.events;sv();ui()}

function goHome(){VIEW='home';SETUPFX=null;WD=null;RT=null;ui()}
function newMatch(){SETUPFX=null;VIEW='setup';ui()}

function openMatch(id){const m=DB.matches.find(x=>x.id===id);if(!m)return;if(!m.events.length&&!m.imp)return startFixture(id);
 CUR=id;EV=m.events;VIEW='match';tab=mInfo(m).st==='done'?'card':'score';WD=null;RT=null;mode='n';sv();ui()}
function delM(id){ask('Delete this match permanently?',()=>{notify('Match deleted');DB.matches=DB.matches.filter(x=>x.id!==id);if(CUR===id){CUR=null;EV=[]}sv()})}
function mInfo(m){const f=m.fx||{};
 if(m.imp){const d=m.imp;return{names:d.names,st:'done',imp:true,res:d.result||'Match completed',date:d.date||'',venue:d.venue||'',fmt:(FMT[d.format]||'')+(d.overs>0?' · '+d.overs+' overs':''),txt:d.innings.map(x=>x.team+' '+x.total+'/'+x.wickets+' ('+x.overs+')').join('  ·  ')}}
 if(!m.events.length)return{names:[f.a||'Team A',f.b||'Team B'],st:'fixture',txt:'',fmt:(FMT[f.format]||'')+(f.overs>0?' · '+f.overs+' overs':''),venue:f.venue||''};
 const r=reduce(m.events),c=r.cfg;if(!c)return{names:['?','?'],st:'fixture',txt:'',fmt:'',venue:''};
 return{names:c.names,st:r.result?'done':'live',res:r.result,fmt:fmtTxt(c),venue:c.venue||f.venue||'',txt:r.inns.map((x,i)=>c.names[i%2===0?c.first:1-c.first]+' '+x.runs+'/'+x.wk+' ('+ovTxt(x.legal)+')').join('  ·  ')}}
function homeList(){const q=HQ.toLowerCase(),all=DB.matches.map(m=>({m,i:mInfo(m)})).filter(({i})=>(i.names.join(' ')+' '+i.venue+' '+i.fmt+' '+(i.res||'')).toLowerCase().includes(q));
 const sec=(t,a,row,emp)=>`<h3 style="margin:14px 0 6px">${t} <span class="mu">(${a.length})</span></h3>${a.length?a.map(row).join(''):`<div class="mu card">${emp}</div>`}`;
 const key=x=>((x.m.fx&&x.m.fx.date)||'9999')+((x.m.fx&&x.m.fx.time)||'');
 const live=all.filter(x=>x.i.st==='live').sort((a,b)=>b.m.updated-a.m.updated),fx=all.filter(x=>x.i.st==='fixture').sort((a,b)=>key(a).localeCompare(key(b))),dn=all.filter(x=>x.i.st==='done').sort((a,b)=>b.m.updated-a.m.updated);
 const del=m=>`<button style="color:var(--dg)" onclick="delM('${m.id}')">Delete</button>`,ttl=i=>`<b>${E(i.names[0])} v ${E(i.names[1])}</b> <span class="mu">${E(i.fmt)}${i.venue?' · '+E(i.venue):''}</span>`;
 return sec('🔴 Live — being scored',live,({m,i})=>`<div class="card">${ttl(i)}<div style="margin:4px 0">${E(i.txt)}</div><button class="p" onclick="openMatch('${m.id}')">Continue scoring</button> ${del(m)}</div>`,'No match is being scored right now.')

 +sec('✅ Completed',dn,({m,i})=>`<div class="card">${ttl(i)}<div style="margin:4px 0"><b>${E(i.res)}</b></div><div class="mu">${E(i.txt)}${i.imp?' · imported'+(i.date?' · '+E(i.date):''):''}</div><div style="margin-top:6px"><button class="p" onclick="openMatch('${m.id}')">Open scorecard</button> ${del(m)}</div></div>`,'No completed matches yet.')}
function home(){return`<div class="card"><h2 style="margin:0 0 8px">🏏 Matches</h2><div class="row"><button class="p" onclick="newMatch()">+ New match</button><button onclick="addFixture()">+ Add fixture</button><button onclick="goImport()">⬇ Import match</button></div><input id="hq" placeholder="Search teams, venue, format, result…" value="${E(HQ)}" oninput="HQ=this.value;document.getElementById('hl').innerHTML=homeList()" style="margin-top:8px"></div><div id="hl">${homeList()}</div>`}
const FMTO=[['t20','T20'],['t10','T10'],['odi','One Day (ODI)'],['test','Test match']];

function setup(){const f=SETUPFX&&DB.matches.find(x=>x.id===SETUPFX),fx=(f&&f.fx)||{},fv=fx.format||'t20',A=fx.a||'Team A',B=fx.b||'Team B',ro=DB.rosters;
 const d=n=>Array.from({length:11},(_,i)=>n+' '+(i+1)),ovv=fx.overs||{t10:10,t20:20,odi:50}[fv]||20;
 return`<div class="card"><h2>🏏 ${f?'Start fixture':'New match'}</h2>

function rosterFill(){const g=id=>document.getElementById(id),ro=DB.rosters;if(ro[g('ta').value.trim()])g('pa').value=ro[g('ta').value.trim()].join('\n');if(ro[g('tb').value.trim()])g('pb').value=ro[g('tb').value.trim()].join('\n')}

function start(){const g=id=>document.getElementById(id),L=id=>g(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
 const a=L('pa'),b=L('pb'),fmv=g('fm').value,ov=fmv==='test'?0:+g('ov').value;

function parsePub(){const p=(typeof location!=='undefined'&&location.pathname)||'',hs=(typeof location!=='undefined'&&location.hash)||'';

function pubRender(){if(!PUB)return;const m=document.getElementById('m'),msg=OUTMSG,wrap=x=>`<div style="max-width:760px;margin:0 auto;padding:12px"><div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>🏏 Live cricket</b><span><a href="${pubHref('')}">Live matches</a> · <a href="${pubBack()}">Open the app</a></span></div>${x}<div class="mu" style="text-align:center;margin:10px">Updates automatically from the scoring device.</div></div>`;
 const live=((msg&&msg.live)||[]).slice().sort((a,b)=>(!!reduce(a.events).result)-(!!reduce(b.events).result));
 if(PUB.kind==='list'){const cards=live.map(x=>{const r=reduce(x.events),c=r.cfg;if(!c)return'';const sc=r.inns.map((y,i)=>c.names[i%2===0?c.first:1-c.first]+' '+y.runs+'/'+y.wk+' ('+ovTxt(y.legal)+')').join('  ·  ');
  return`<div class="card"><div class="mu">${r.result?'Result':'🔴 LIVE'} · ${E(fmtTxt(c))}${c.venue?' · '+E(c.venue):''}</div><b>${E(c.names[0])} v ${E(c.names[1])}</b><div style="margin:4px 0">${E(sc)}</div>${r.result?`<div><b>${E(r.result)}</b></div>`:''}<a href="${pubHref(x.id)}"><button class="p">Live score</button></a></div>`}).join('');
  m.innerHTML=wrap(`<h2 style="margin:6px 0">Live &amp; recent matches</h2>${cards||'<div class="card mu">No live matches right now.</div>'}`);return}

function pubScore(r){const{cfg,inns,result}=r,i=inns.length-1,s=inns[i],tn=cfg.names[i%2===0?cfg.first:1-cfg.first];
 let h=`<div class="card"><div class="mu">${result?'Result':'🔴 LIVE'} · ${E(fmtTxt(cfg))}${cfg.venue?' · '+E(cfg.venue):''}</div><b>${E(cfg.names[0])} v ${E(cfg.names[1])}</b><div class="mu" style="margin-top:6px">${E(tn)} batting · innings ${i+1}</div><div class="big">${s.runs}/${s.wk} <span style="font-size:16px">(${ovTxt(s.legal)} ov)</span></div><div class="mu">CRR ${crr(s)}`;
 if(s.target){const need=Math.max(s.target-s.runs,0),left=cfg.overs>0?cfg.overs*6-s.legal:0;h+=` · Target ${s.target} · need ${need}`+(cfg.overs>0?` from ${left} balls · RRR ${left>0?(need*6/left).toFixed(2):'-'}`:'')}

 if(result)h+=`<div class="card"><div class="big">🏆 ${E(result)}</div></div>`;
 else if(!s.done&&s.strike&&s.non){const W=s.W[s.bowler];h+=`<div class="card" style="overflow-x:auto"><table><tr><th>Batter</th><th class="r">R</th><th class="r">B</th><th class="r">4s</th><th class="r">6s</th><th class="r">SR</th></tr>${[s.strike,s.non].map(n=>{const b=s.B[n];return`<tr><td>${E(n)}${n===s.strike?' *':''}</td><td class="r">${b.r}</td><td class="r">${b.b}</td><td class="r">${b.f}</td><td class="r">${b.s}</td><td class="r">${b.b?(b.r*100/b.b).toFixed(1):'-'}</td></tr>`}).join('')}</table><div class="mu" style="margin-top:6px">Partnership ${s.part.r} (${s.part.b})${W?' · '+E(s.bowler)+' '+ovTxt(W.b)+'-'+W.m+'-'+W.r+'-'+W.w:''}</div><div style="margin-top:6px">This over: ${s.over.map(t=>`<span class="tk ${t.includes('W')?'w':''}">${t||'0'}</span>`).join('')||'<span class="mu">—</span>'}</div></div>`}
 h+=`<div class="card"><b>Commentary</b>${[...s.log].reverse().slice(0,10).map(l=>`<div style="padding:4px 0;border-bottom:1px solid var(--bd)"><span class="mu">${l.ov}</span> ${E(l.b)} to ${E(l.t)}: ${E(l.txt)}</div>`).join('')||'<div class="mu">No balls yet.</div>'}</div><h3 style="margin:10px 0 6px">Full scorecard</h3>`+card(r);return h}

function wwPend(){const un=new Set(EV.filter(e=>e.t==='undo').map(e=>e.target)),eff=EV.filter(e=>!un.has(e.id)&&e.t!=='undo');let lb=null;
 for(let i=eff.length-1;i>=0;i--)if(eff[i].t==='ball'){lb=eff[i];break}
 if(!lb||lb.w||!(lb.k==='n'||lb.k==='nb')||!(lb.r>0))return null;

function wheelSVG(sh,w,tap,hand,ori){const bt=(ori||WW.display)==='bottom',L=hand?(hand==='L'?(bt?['LEG SIDE','OFF SIDE']:['OFF SIDE','LEG SIDE']):(bt?['OFF SIDE','LEG SIDE']:['LEG SIDE','OFF SIDE'])):null;

const ZN=['Long off','Cover','Point','Third man','Fine leg','Square leg','Mid-wicket','Long on'];
function normShots(sh){const H=(R&&R.hands)||{};return sh.map(p=>({...p,x:H[p.batter]==='L'?-p.x:p.x}))}
function zoneStats(sh){const z=ZN.map(n=>({n,runs:0,k:0}));let tot=0;
 sh.forEach(p=>{let a=Math.atan2(p.x,-p.y)*180/Math.PI;if(a<0)a+=360;const i=Math.min(7,Math.floor(a/45));z[i].runs+=p.runs;z[i].k++;tot+=p.runs});
 z.forEach(q=>{q.pct=tot?Math.round(q.runs*100/tot):0});return{z,tot}}
function zoneSVG(sh,c2,ori){const bt=(ori||WW.display)==='bottom',sg=bt?-1:1,{z,tot}=zoneStats(sh),mx=Math.max(1,...z.map(q=>q.runs)),P=(a,r)=>[+(r*Math.sin(a*Math.PI/180)).toFixed(2),+(-r*Math.cos(a*Math.PI/180)).toFixed(2)];
 let g='';z.forEach((q,i)=>{const a=P(i*45,100),b=P((i+1)*45,100),op=tot?(.12+.7*q.runs/mx).toFixed(2):'.08';g+=`<path d="M0,0 L${a[0]},${a[1]} A100,100 0 0 1 ${b[0]},${b[1]} Z" fill="${c2}" fill-opacity="${op}"/>`});
 for(let i=0;i<8;i++){const e=P(i*45,100);g+=`<line x1="0" y1="0" x2="${e[0]}" y2="${e[1]}" stroke="#fff" stroke-width="1.6"/>`}
 sh.forEach(p=>{g+=`<circle cx="${p.x}" cy="${p.y}" r="2" fill="${wcol(p.runs)}" opacity=".55"/>`});
 const T='text-anchor="middle" fill="#fff" stroke="#000" stroke-width="1.5" paint-order="stroke" font-weight="700"';let t='';
 z.forEach((q,i)=>{const m=P(i*45+22.5,64),X=sg*m[0],Y=sg*m[1];t+=`<text x="${X}" y="${Y-8}" ${T} font-size="6.4">${q.n}</text><text x="${X}" y="${Y+4}" ${T} font-size="13">${q.pct}%</text><text x="${X}" y="${Y+12}" ${T} font-size="5.8">${q.runs} run${q.runs===1?'':'s'}</text>`});
 const S='font-size="7.5" font-weight="700" fill="#fff" opacity=".9"',sy=bt?-112:119,l1=bt?'OFF SIDE':'LEG SIDE',l2=bt?'LEG SIDE':'OFF SIDE';
 return`<svg viewBox="-124 -124 248 248" style="width:100%;max-width:100%;display:block"><circle r="120" fill="#17402a"/><circle r="100" fill="#2f6e43"/><g${bt?' transform="rotate(180)"':''}>${g}</g><circle r="100" fill="none" stroke="#fff" stroke-width="3"/><rect x="-3" y="-11" width="6" height="22" fill="#d9c28f"/>${t}<text x="-119" y="${sy}" text-anchor="start" ${S}>${l1}</text><text x="119" y="${sy}" text-anchor="end" ${S}>${l2}</text><text x="0" y="${bt?116:-108}" text-anchor="middle" font-size="7" fill="#fff" opacity=".7">BOWLER'S END</text></svg>`}

function wwTap(e){const r=e.currentTarget.getBoundingClientRect();const bq=WW.entry==='bottom';let x=bq?124-(e.clientX-r.left)/r.width*248:(e.clientX-r.left)/r.width*248-124,y=bq?124-(e.clientY-r.top)/r.height*248:(e.clientY-r.top)/r.height*248-124;const d=Math.hypot(x,y),p=wwPend();if(!p)return;
